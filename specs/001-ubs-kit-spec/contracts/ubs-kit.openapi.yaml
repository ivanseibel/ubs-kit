openapi: 3.0.3
info:
  title: UBS Kit CLI Contract
  version: 0.1.0
  description: |
    Behavioral contract for UBS Kit CLI actions. This contract models CLI
    actions as request/response operations for deterministic behavior.
servers:
  - url: http://localhost
paths:
  /scaffold:
    post:
      summary: Scaffold canonical .ubs/ assets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScaffoldRequest'
      responses:
        '200':
          description: Scaffold completed with no conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScaffoldResponse'
        '409':
          description: Conflicts detected; no files written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictReport'
        '400':
          description: Invalid input or non-repository path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /validate:
    post:
      summary: Validate UBS structural rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateRequest'
      responses:
        '200':
          description: Validation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationReport'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ScaffoldRequest:
      type: object
      required: [baseDir, dryRun, force]
      properties:
        baseDir:
          type: string
          description: Repository root path
        dryRun:
          type: boolean
          description: If true, perform a no-write preview
        force:
          type: boolean
          description: If true, overwrite conflicts
        domains:
          type: array
          items:
            type: string
          description: Optional domain filters for scaffolding
    ScaffoldResponse:
      type: object
      required: [writtenFiles, skippedFiles]
      properties:
        writtenFiles:
          type: array
          items:
            type: string
        skippedFiles:
          type: array
          items:
            type: string
    ConflictReport:
      type: object
      required: [conflicts]
      properties:
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/Conflict'
    Conflict:
      type: object
      required: [path, reason]
      properties:
        path:
          type: string
        reason:
          type: string
    ValidateRequest:
      type: object
      required: [baseDir]
      properties:
        baseDir:
          type: string
        paths:
          type: array
          items:
            type: string
          description: Optional subset of files to validate
    ValidationReport:
      type: object
      required: [isValid, issues]
      properties:
        isValid:
          type: boolean
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
    ValidationIssue:
      type: object
      required: [filePath, ruleId, message]
      properties:
        filePath:
          type: string
        ruleId:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
